server.port=8095

# Database Connection Configuration for MySQL agc_cms
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/agc_cms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# File upload properties
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload-dir=./uploads

# Console Logging & Colors
spring.output.ansi.enabled=ALWAYS
logging.level.com.agc.cms=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=INFO
