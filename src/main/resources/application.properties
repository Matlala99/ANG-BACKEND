server.port=${SERVER_PORT:8097}

# Database Connection Configuration for MySQL agc_cms
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/agc_cms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=CONVERT_TO_NULL}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT Authentication Properties
jwt.secret=${JWT_SECRET:d291bGQteW91LWxpa2UtdG8tYnVpbGQtYS1zdXBlci1zZWN1cmUtand0LXNlY3JldC1rZXktZm9yLWFnYy1jbXMtMjAyNiE=}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}

# CORS Allowed Origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost:4200,http://127.0.0.1:4200}

# File upload properties
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# Console Logging & Colors
spring.output.ansi.enabled=ALWAYS
logging.level.com.agc.cms=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc.core.JdbcTemplate=INFO
